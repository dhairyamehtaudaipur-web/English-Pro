name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Prepare Web Files
        run: npm run build

      - name: Setup Android Platform
        run: npx cap add android

      - name: Inject AdMob App ID Safely
        run: |
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9418296168496664~5196058331"/>\n</application>|' android/app/src/main/AndroidManifest.xml

      - name: Generate App Icons and Splash
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor Files
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
